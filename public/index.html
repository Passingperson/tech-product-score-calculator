<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>科技产品分值计算器</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>📱 科技产品分值计算器</h1>
    </header>

    <!-- 人体视图区域 -->
    <section class="body-view">
      <!-- 总分合计显示 -->
      <div id="totalScoreDisplay" class="total-score-display">
        选中产品总分：<span id="totalScoreValue">0.0</span>
      </div>

      <div class="body-column">
        <h2>正面</h2>
        <div class="body-svg-wrapper" id="frontBody">
          <svg viewBox="0 0 200 400" width="200" height="400">
            <circle cx="100" cy="50" r="20" fill="none" stroke="#333" stroke-width="2"/>
            <rect x="80" y="70" width="40" height="120" fill="none" stroke="#333" stroke-width="2"/>
            <line x1="80" y1="80" x2="50" y2="140" stroke="#333" stroke-width="2"/>
            <line x1="50" y1="140" x2="50" y2="180" stroke="#333" stroke-width="2"/>
            <line x1="120" y1="80" x2="150" y2="140" stroke="#333" stroke-width="2"/>
            <line x1="150" y1="140" x2="150" y2="180" stroke="#333" stroke-width="2"/>
            <line x1="90" y1="190" x2="70" y2="280" stroke="#333" stroke-width="2"/>
            <line x1="70" y1="280" x2="70" y2="350" stroke="#333" stroke-width="2"/>
            <line x1="110" y1="190" x2="130" y2="280" stroke="#333" stroke-width="2"/>
            <line x1="130" y1="280" x2="130" y2="350" stroke="#333" stroke-width="2"/>
            <rect x="125" y="230" width="15" height="10" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="2"/>
          </svg>
          <div id="frontLabels" class="label-container"></div>
        </div>
        <p class="hint">点击卡片选择产品，标签将出现在对应部位</p>
      </div>

      <div class="body-column">
        <h2>侧面（背包）</h2>
        <div class="body-svg-wrapper" id="sideBody">
          <svg viewBox="0 0 200 400" width="200" height="400">
            <circle cx="80" cy="50" r="20" fill="none" stroke="#333" stroke-width="2"/>
            <rect x="70" y="70" width="45" height="120" fill="none" stroke="#333" stroke-width="2"/>
            <line x1="115" y1="80" x2="140" y2="160" stroke="#333" stroke-width="2"/>
            <line x1="85" y1="190" x2="70" y2="280" stroke="#333" stroke-width="2"/>
            <line x1="70" y1="280" x2="70" y2="350" stroke="#333" stroke-width="2"/>
          </svg>
          <div id="backpackList" class="backpack-list">
            <span class="empty-hint">未选中大型产品</span>
          </div>
        </div>
        <p class="hint">中大型产品将自动放入背包</p>
      </div>
    </section>

    <!-- 产品卡片网格 -->
    <div id="productGrid" class="grid"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
