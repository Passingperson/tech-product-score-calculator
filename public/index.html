<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>科技产品分值计算器</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>📱 科技产品分值计算器</h1>
    </header>

    <!-- 人体视图区域 -->
    <section class="body-view">
      <!-- 总分合计显示 -->
      <div id="totalScoreDisplay" class="total-score-display">
        选中产品总分：<span id="totalScoreValue">0.0</span>
      </div>

      <div class="body-column">
        <h2>正面</h2>
        <div class="body-svg-wrapper" id="frontBody">
          <svg viewBox="0 0 200 400" width="200" height="400">
            <!-- 正面人体轮廓 - 使用更流畅的线条和圆润形状 -->
            <g stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <!-- 头部（椭圆） -->
              <ellipse cx="100" cy="40" rx="18" ry="22"/>
              <!-- 颈部 -->
              <line x1="92" y1="60" x2="90" y2="72"/>
              <line x1="108" y1="60" x2="110" y2="72"/>
              <!-- 躯干（带肩部和腰部曲线） -->
              <path d="M 75 75 
                      C 95 68, 105 68, 125 75 
                      L 118 130 
                      C 110 140, 90 140, 82 130 
                      Z"/>
              <!-- 左臂（上臂+前臂） -->
              <path d="M 75 80 Q 50 110 55 160"/>
              <path d="M 55 160 Q 50 175 58 190"/>
              <!-- 右臂 -->
              <path d="M 125 80 Q 150 110 145 160"/>
              <path d="M 145 160 Q 150 175 142 190"/>
              <!-- 左腿 -->
              <path d="M 90 170 Q 75 220 75 290"/>
              <path d="M 75 290 Q 75 310 80 345"/>
              <!-- 右腿 -->
              <path d="M 110 170 Q 125 220 125 290"/>
              <path d="M 125 290 Q 125 310 120 345"/>
              <!-- 双脚 -->
              <path d="M 75 345 Q 80 350 85 345"/>
              <path d="M 125 345 Q 120 350 115 345"/>
            </g>
            <!-- 口袋位置（保持原有虚线框，用于指示标签位置） -->
            <rect x="125" y="225" width="16" height="10" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="3,3"/>
          </svg>
          <div id="frontLabels" class="label-container"></div>
        </div>
        <p class="hint">点击卡片选择产品，标签将出现在对应部位</p>
      </div>

      <div class="body-column">
        <h2>侧面（背包）</h2>
        <div class="body-svg-wrapper" id="sideBody">
          <svg viewBox="0 0 200 400" width="200" height="400">
            <!-- 侧面人体轮廓 - 更真实的体态 -->
            <g stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <!-- 头部（椭圆） -->
              <ellipse cx="80" cy="40" rx="16" ry="22"/>
              <!-- 颈部 -->
              <line x1="80" y1="60" x2="78" y2="72"/>
              <!-- 躯干（背部平直，腹部微凸） -->
              <path d="M 60 75 
                      L 110 75 
                      C 115 100, 112 130, 108 150 
                      L 100 170
                      L 60 170
                      Z"/>
              <!-- 手臂（自然下垂于身前） -->
              <path d="M 105 80 Q 135 110 130 160"/>
              <path d="M 130 160 Q 128 175 118 185"/>
              <!-- 前面的腿（左腿） -->
              <path d="M 85 170 Q 75 210 75 290"/>
              <path d="M 75 290 Q 75 310 80 345"/>
              <!-- 后面的腿（右腿，稍后位置） -->
              <path d="M 98 170 Q 105 210 108 290"/>
              <path d="M 108 290 Q 108 310 105 345"/>
              <!-- 脚 -->
              <path d="M 75 345 L 80 350 L 85 345"/>
              <path d="M 105 345 L 100 350 L 95 345"/>
            </g>
            <!-- 背包虚线框（保持原有位置） -->
            <rect x="30" y="100" width="44" height="72" rx="4" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,4"/>
          </svg>
          <div id="backpackList" class="backpack-list">
            <span class="empty-hint">未选中大型产品</span>
          </div>
        </div>
        <p class="hint">中大型产品将自动放入背包</p>
      </div>
    </section>

    <!-- 产品卡片网格 -->
    <div id="productGrid" class="grid"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
